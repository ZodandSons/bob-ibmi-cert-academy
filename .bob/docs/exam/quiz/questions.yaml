- id: 5-01
  section: 5
  objective: "5.1"
  question: >-
    What does the Bob factor metric in Bobalytics represent?
  options:
    a: The number of prompts per user
    b: The percentage of committed code created by Bob
    c: The Bobcoin price
    d: The number of MCP servers
  answer: [b]
  explain: Bob factor = Bob's contribution to the codebase (share of committed lines Bob created).
  study: section-5-accounts.md#51-administer-bobalytics

- id: 5-02
  section: 5
  objective: "5.1"
  question: >-
    What can an administrator see about an individual developer from a team-level Bobalytics chart?
  options:
    a: Their full prompt history
    b: Their Bobcoin spend by name
    c: Nothing individually identifiable; team charts are anonymized
    d: Their source code
  answer: [c]
  explain: Bobalytics gives team-level insights without exposing individual user data to admins.
  study: section-5-accounts.md#51-administer-bobalytics

- id: 5-03
  section: 5
  objective: "5.2"
  question: >-
    A CI pipeline runs Bob Shell with a General API key and fails authentication for inference. What is missing?
  options:
    a: A team ID (--team-id)
    b: A PR template
    c: An MCP server
    d: Plan mode
  answer: [a]
  explain: General keys are instance-wide and need a team ID for inference. Inference keys are already team-scoped.
  study: section-5-accounts.md#52-authenticate-with-api-keys

- id: 5-04
  section: 5
  objective: "5.3"
  question: >-
    Which capability is specific to the Enterprise plan?
  options:
    a: Using Ask mode
    b: SSO with SAML or OIDC identity providers and shared Bobcoin pools with spending limits
    c: Running /init
    d: Writing custom rules
  answer: [b]
  explain: Enterprise adds team management, shared Bobcoin allocation, spending limits, Bobalytics and SSO (SAML/OIDC).
  study: section-5-accounts.md#53-enterprise-plan-features

- id: 5-05
  section: 5
  objective: "5.4"
  question: >-
    What is the relationship between tokens and Bobcoins?
  options:
    a: They are identical units
    b: Tokens are raw model usage units; Bobcoins abstract token usage into a predictable billing metric
    c: Bobcoins count only output tokens
    d: Tokens are billed in USD, Bobcoins are free
  answer: [b]
  explain: Bobcoins combine token usage across models and operations into one consumption metric.
  study: section-5-accounts.md#54-bobcoins

- id: 5-06
  section: 5
  objective: "5.5"
  question: >-
    Late in a long task, a developer's one-line question uses far more tokens than the same
    question did at the start. Why?
  options:
    a: The system prompt grows after each response
    b: The full active context, including all accumulated messages, is processed again with each prompt
    c: Bob switches to a more expensive model after 10 messages
    d: Short prompts are billed at a minimum size
  answer: [b]
  explain: Every prompt re-sends the whole active context, so a growing Messages category raises the cost of later prompts.
  study: section-5-accounts.md#55-token-usage-for-prompting

# ----------------------------------------------------------------- Section 6
- id: 6-01
  section: 6
  objective: "6.1"
  question: >-
    A developer enables auto-approval for Edit using the Permissions control beside the mode selector for the current task. What is the scope?
  options:
    a: All future tasks for that user
    b: All users in the organization
    c: The current task only; it does not become a global permission
    d: Until the IDE restarts
  answer: [c]
  explain: Task-level approvals override the normal approval experience for that task only.
  study: section-6-security.md#61-modify-mode-permissions-in-a-contexttask

- id: 6-02
  section: 6
  objective: "6.2"
  question: >-
    Bob keeps building on an earlier wrong assumption even after several corrective prompts.
    What is the most reliable fix?
  options:
    a: Add the correction to every prompt
    b: Start a fresh task with a narrow scope and only targeted evidence
    c: Enable auto-approve so Bob works faster
    d: Add more MCP servers
  answer: [b]
  explain: >-
    That's context poisoning. Bad content persists in Messages; a new task with lean,
    targeted context is the reliable recovery.
  study: section-6-security.md#62-reduce-context-poisoning

- id: 6-03
  section: 6
  objective: "6.2"
  question: >-
    Which practice helps PREVENT context poisoning during a broad codebase investigation?
  options:
    a: Paste the entire repository into the chat
    b: Use subagents so the main task receives only condensed findings
    c: Keep one task open for all work this week
    d: Load every available skill at the start
  answer: [b]
  explain: Subagents keep intermediate reads out of the main context; keep standing context lean and evidence targeted.
  study: section-6-security.md#62-reduce-context-poisoning

- id: 6-04
  section: 6
  objective: "6.3"
  question: >-
    A documentation mode must only be able to edit Markdown files. How is this enforced?
  options:
    a: A rule that says "only edit .md files"
    b: An edit group with a fileRegex such as .*\.md$ in the mode definition
    c: Adding source files to .gitignore
    d: A SessionStart hook
  answer: [b]
  explain: fileRegex on the edit group restricts which files a mode can change.
  study: section-6-security.md#63-identify-and-enable-correct-permission-restrictions-for-projects

- id: 6-05
  section: 6
  objective: "6.4"
  question: >-
    Which TWO statements about .bobignore are true? (Select two)
  options:
    a: Bob monitors it and reloads changes automatically
    b: It is a full system-level sandbox
    c: The .bobignore file itself is implicitly ignored, so Bob cannot change its own access rules
    d: It must be named .bob/ignore.json
    e: It blocks mode switching
  answer: [a, c]
  explain: It auto-reloads and is implicitly ignored itself. It is not a sandbox, lives in the workspace root as .bobignore, and doesn't affect mode switching.
  study: section-6-security.md#64-produce-a-bobignore-file

- id: 6-06
  section: 6
  objective: "6.4"
  question: >-
    Which pattern in .bobignore re-allows a file excluded by a broader rule?
  options:
    a: "#important.log"
    b: "!important.log"
    c: "+important.log"
    d: "allow: important.log"
  answer: [b]
  explain: .gitignore syntax uses ! for exceptions (e.g. !.env.example).
  study: section-6-security.md#64-produce-a-bobignore-file

- id: 6-07
  section: 6
  objective: "6.5"
  question: >-
    Which permissions does IBM classify as high risk?
  options:
    a: Read and Skill
    b: Edit and Execute
    c: Todo and Mode
    d: Subtask and Subagent
  answer: [b]
  explain: Edit and Execute are high; MCP is medium-high; Read and Skill medium; Todo, Subtask, Subagent, Mode low.
  study: section-6-security.md#65-correct-permissions-and-approval-workflows

- id: 6-08
  section: 6
  objective: "6.5"
  question: >-
    Bob proposes a terminal command that is almost right but targets the wrong library. What can the developer do?
  options:
    a: Only approve or reject; commands cannot be changed
    b: Edit the command directly in the approval prompt before running it
    c: Restart the task
    d: Disable the execute group globally
  answer: [b]
  explain: Terminal commands proposed by Bob can be edited in the approval prompt before execution.
  study: section-6-security.md#65-correct-permissions-and-approval-workflows

- id: 6-09
  section: 6
  objective: "6.6"
  question: >-
    Bob needs a token to call an internal test-results service. What is the recommended approach?
  options:
    a: Paste it in the chat and delete the message afterwards
    b: Put it in AGENTS.md so Bob always has it
    c: Store it in an approved secrets solution and provide it at runtime
    d: Hard-code it in mcp.json and commit it
  answer: [c]
  explain: Never place secrets in prompts or Bob-readable files. Use secrets management and runtime injection.
  study: section-6-security.md#66-best-security-practices

- id: 6-10
  section: 6
  objective: "6.7"
  question: >-
    When does Bob create rollback snapshots?
  options:
    a: Only when the developer commits
    b: When a task begins and before file modifications, but not automatically before terminal commands
    c: Before every terminal command
    d: Only when requested manually
  answer: [b]
  explain: Snapshots are stored in a shadow Git repo at task start and before file edits; terminal commands don't trigger them.
  study: section-6-security.md#67-rollback-changes

- id: 6-11
  section: 6
  objective: "6.7"
  question: >-
    A developer wants to undo Bob's file changes but keep the conversation to try another approach. Which option?
  options:
    a: Restore files
    b: Restore files and task
    c: Delete the task
    d: git reset --hard
  answer: [a]
  explain: >-
    Restore files keeps conversation history. Restore files and task also removes later
    messages, needs confirmation, and cannot be undone.
  study: section-6-security.md#67-rollback-changes

- id: 6-12
  section: 6
  objective: "6.3"
  question: >-
    A project contains scripts that deploy to production libraries. What is the appropriate permission posture?
  options:
    a: Enable auto-approve for Edit and Execute to avoid slowing developers down
    b: Restricted project modes plus conservative auto-approve, keeping more manual approvals and narrower permissions than routine local work
    c: Rely on .bobignore alone, since it sandboxes commands
    d: Remove the project from version control
  answer: [b]
  explain: >-
    Combine custom-mode restrictions (tool groups, fileRegex) with conservative auto-approve.
    Sensitive or production-related work keeps more manual approvals. .bobignore is not a sandbox.
  study: section-6-security.md#63-identify-and-enable-correct-permission-restrictions-for-projects
